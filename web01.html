<!DOCTYPE html>
<html>

<head>
    <title>WEB LATIHAN 1</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        table, th, td {
            border: 1px solid white;
            border-collapse: collapse;
        }

        .tabel {
            margin: 1;
            padding-left : 70px;
            padding-bottom: 150px;
        }

        .tabel1 > h2{
            margin: 1;
            padding: 20px;
        }

        p{
            max-width: 200px;
        }
    </style>
</head>

<body>

    <table style="width:100%; width: 800px; margin: auto;">
        <tr>
            <th colspan="3"
                style="border: 1px solid rgb(255, 255, 0); font-weight: normal; background-color: #ffffbb; height:100px">HEADER
            </th>
        </tr>
        <tr>
            <th colspan="3" style="border: 1px solid #3299c9; font-weight: normal; background-color: rgb(195, 255, 255); height:50px">NAVIGASI</th>
        </tr>
        <tr>
            <td class="tabel1" colspan="2" style="border: 1px solid rgb(255, 79, 79); background-color: rgb(255, 161, 161); height:400px">
                <article class="tabel" style="width: 50%;">
                    <h1>Heading 1</h1>
                    <p>bbkbkaljdljlfafhkshfaskfaksfhjas fhkasjkfhjgdfsgsfgdfgdgdgdfgfdgdfgd gdfggdfgdfgdfgdfgdgdfsdfasddadasdghdfhdfgdghdf
                    </p>
                </article>
                </th>
            <td class="tabel1" style="border: 1px solid rgb(40, 255, 51); background-color: rgb(187, 255, 190)">
                <h3>Menu :</h3>
                    <ul>
                    <li>Coffee</li>
                    <li>Tea</li>
                    <li>Milk</li>
                    </ul>
                </th>
        </tr>
        <tr>
            <th colspan="3"
                style="border: 1px solid rgb(255, 255, 0); font-weight: normal; background-color: #ffffbb; height:50px">FOOTER
            </th>
        </tr>
    </table>

</body>

</html>

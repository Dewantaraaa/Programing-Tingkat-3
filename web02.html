<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTML Forms</title>
    <style>
        .myDiv {
        width: 380px;
        margin: auto;
        background-color: rgb(255, 255, 255);
        border: 2px solid black;
        }
        
        .tablestyle {
        padding-left: 10px;
        }

        .scroll-box {
            width: 360px;
            height: 180px;
            overflow: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .scroll-box1 {
            width: 150px;
            height: 80px;
            overflow: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        </style>
</head>
<body>

<div class="myDiv">
    <div class="scroll-box">
        <table class="tablestyle">
            <tr>
                <td>Name:</td>
                <td><input type="text" id="fname" style="width: 200px;" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" id="email" style="width: 250px;" placeholder="Enter your email"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><textarea type="text" id="address" style="height: 80px;" placeholder="Enter your address" class="scroll-box1"></textarea></td>
            </tr>
            <tr>
                <td>Postcode:</td>
                <td><input type="text" id="postcode" placeholder="Enter your postcode" style="width: 130px;"></td>
            </tr>
        </table>
    </div>
</div>

</body>
</html>
